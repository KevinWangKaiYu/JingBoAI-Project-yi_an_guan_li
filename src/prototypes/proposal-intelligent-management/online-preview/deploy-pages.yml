name: Deploy prototype preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/prototypes/proposal-intelligent-management/online-preview/package.json
      - name: Install dependencies
        working-directory: src/prototypes/proposal-intelligent-management/online-preview
        run: npm install
      - name: Build preview
        working-directory: src/prototypes/proposal-intelligent-management/online-preview
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/prototypes/proposal-intelligent-management/online-preview/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4